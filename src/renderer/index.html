<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>GittyGo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="titlebar-spacer"></div>
      <div class="repo-identity"><strong id="repo-name">GittyGo</strong></div>
      <div class="repository-controls">
        <button id="branch-button" class="header-button" title="Switch or create branch"><span class="branch-icon">⑂</span><span id="branch-name">—</span></button>
        <span id="sync-state" class="sync-state"></span>
        <button id="fetch-button" class="icon-button" title="Fetch all remotes">↻</button>
        <button id="more-button" class="icon-button" title="More actions">•••</button>
      </div>
    </header>

    <nav class="view-tabs" aria-label="Git view">
      <button data-view="changes" class="active">Changes</button>
      <button data-view="history">History</button>
      <div class="live-state"><span class="live-dot"></span><span id="updated-label">Live</span></div>
    </nav>

    <main id="changes-view" class="workspace view">
      <button class="sidebar-toggle" data-sidebar="changes" aria-label="Collapse Changes sidebar" title="Collapse sidebar">‹</button>
      <aside class="sidebar">
        <div id="commit-panel" class="commit-panel">
          <div class="commit-label"><label for="commit-message">Commit message</label><label class="amend-option"><input id="amend-checkbox" type="checkbox" /> Amend</label></div>
          <textarea id="commit-message" rows="3" placeholder="Describe the staged changes…"></textarea>
          <button id="commit-button" class="primary-button" disabled>Commit</button>
        </div>
        <div id="file-groups" class="file-groups"></div>
      </aside>

      <section class="review-pane">
        <header id="file-toolbar" class="file-toolbar hidden">
          <div class="selected-file"><span id="selected-status" class="status-badge"></span><span id="selected-path"></span></div>
          <div class="toolbar-actions">
            <div class="segmented" aria-label="Diff layout">
              <button data-layout="unified" class="active">Unified</button><button data-layout="split">Side by side</button>
            </div>
            <button id="file-action" class="quiet-button"></button>
            <button id="discard-file" class="danger-button">Discard</button>
          </div>
        </header>
        <div id="content" class="content"></div>
      </section>
    </main>

    <main id="history-view" class="history-workspace view hidden">
      <button class="sidebar-toggle" data-sidebar="history" aria-label="Collapse History sidebar" title="Collapse sidebar">‹</button>
      <aside class="history-list-pane">
        <header class="pane-heading"><strong>Commit history</strong><span id="history-count"></span></header>
        <div id="history-list" class="history-list"></div>
      </aside>
      <section class="history-detail-pane">
        <div id="history-detail" class="content"></div>
      </section>
    </main>
  </div>

  <div id="more-menu" class="popover menu hidden">
    <div class="menu-label">Commit</div>
    <button data-command="undo">Undo last commit…</button>
    <div class="menu-separator"></div>
    <div class="menu-label">Sync</div>
    <button data-command="fetch">Fetch</button><button data-command="pull">Pull…</button><button data-command="push">Push…</button>
    <div class="menu-separator"></div>
    <div class="menu-label">Remotes</div>
    <button data-command="remotes">Manage remotes…</button>
  </div>

  <div id="branch-popover" class="popover branch-popover hidden">
    <header><strong>Branches</strong><button id="close-branches">×</button></header>
    <div class="new-branch"><input id="new-branch-name" placeholder="New branch name" /><button id="create-branch">Create</button></div>
    <div id="branch-list"></div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title">Manage remotes</h2><button id="close-modal">×</button></header>
      <div id="modal-content"></div>
    </section>
  </div>

  <div id="selection-action" class="selection-action hidden"><span id="selection-count"></span><button id="add-comment" class="comment-selection-button">Add comment</button><button id="apply-selection"></button><button id="clear-selection">×</button></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
